# Networking: IPv4 only, used for the management address of the bridge
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_DHCPV4=y
CONFIG_NET_UDP=y
CONFIG_NET_TCP=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_STACK_SIZE=2048
CONFIG_NET_STATISTICS=y
CONFIG_NET_SHELL=y
# IPv4 configuration for the bridge and both port interfaces
CONFIG_NET_IF_MAX_IPV4_COUNT=4
# ARP probes and announcements for a static bridge address, so that proxy ARP
# on the host learns it without waiting for other traffic
CONFIG_NET_IPV4_ACD=y

# Static bridge address; T1S devices still get theirs by DHCP (relayed by the
# host). Leave CONFIG_T1S_BRIDGE_IPV4_ADDR empty to use DHCP for the bridge.
CONFIG_T1S_BRIDGE_IPV4_ADDR="10.10.193.75"
CONFIG_T1S_BRIDGE_IPV4_GW="10.10.193.1"

# Buffers sized for 10 Mbit/s on both ports and 192 KB SRAM
CONFIG_NET_PKT_RX_COUNT=24
CONFIG_NET_PKT_TX_COUNT=24
CONFIG_NET_BUF_RX_COUNT=64
CONFIG_NET_BUF_TX_COUNT=64

# Layer 2 bridge between the USB CDC NCM and the LAN865x interfaces
CONFIG_ETH_DRIVER=y
CONFIG_NET_ETHERNET_BRIDGE=y
CONFIG_NET_ETHERNET_BRIDGE_FDB=y
CONFIG_NET_ETHERNET_BRIDGE_SHELL=y
# Bridge MAC derived from the STM32 96-bit unique ID: the same on every boot,
# so the DHCP server can hand out the same address (or a reservation)
CONFIG_HWINFO=y
CONFIG_NET_ETHERNET_BRIDGE_UNIQUE_MAC=y

# USB device: CDC NCM network interface only. The STM32F429 USB OTG FS
# controller has 4 endpoints, too few for CDC NCM and the board's CDC ACM
# console together, so the console, log and shell use SEGGER RTT.
CONFIG_BOARD_SERIAL_BACKEND_CDC_ACM=n
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=n
CONFIG_USBD_CDC_NCM_CLASS=y
CONFIG_SAMPLE_USBD_PRODUCT="UNI Clicker T1S bridge"
CONFIG_USBD_LOG_LEVEL_WRN=y
CONFIG_UDC_DRIVER_LOG_LEVEL_WRN=y

# Console and shell on SEGGER RTT (J-Link); the log is printed by the shell
CONFIG_USE_SEGGER_RTT=y
CONFIG_UART_CONSOLE=n
CONFIG_RTT_CONSOLE=y
CONFIG_LOG=y
CONFIG_LOG_BACKEND_RTT=n
CONFIG_LOG_BACKEND_UART=n
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_RTT=y
CONFIG_SHELL_BACKEND_SERIAL=n
# Room for a full shell command line sent at once (default: 16 bytes)
CONFIG_SEGGER_RTT_BUFFER_SIZE_DOWN=128
CONFIG_MAIN_STACK_SIZE=2048

# Second shell on telnet (port 23) once the bridge has an address. The shell
# is unauthenticated: use on a trusted network only.
CONFIG_SHELL_BACKEND_TELNET=y
